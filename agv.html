<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGV 3D 结构示意</title>
  <style>
    :root{
      --bg1:#071521;
      --bg2:#0d1d2b;
      --panel:#12293b;
      --steel:#b8c7d6;
      --steel-dark:#7c8ea1;
      --accent:#5ad1ff;
      --accent2:#7ef0b5;
      --wheel:#2e2f33;
      --wheel-rim:#8a9aa8;
      --sensor:#dfeeff;
      --battery:#4adca3;
      --platform:#c9d8e8;
      --shadow:rgba(0,0,0,0.35);
    }

    *{ box-sizing:border-box; }
    html,body{
      margin:0;
      height:100%;
      background: radial-gradient(circle at 50% 20%, #153041 0%, var(--bg1) 30%, var(--bg2) 100%);
      color:#eaf7ff;
      font-family: "Segoe UI", Arial, sans-serif;
      overflow:hidden;
    }

    .ui{
      position:absolute;
      top:16px; left:16px;
      z-index:10;
      background:rgba(10,20,30,0.45);
      border:1px solid rgba(130,200,255,0.25);
      border-radius:12px;
      padding:10px 14px;
      backdrop-filter: blur(6px);
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }
    .ui h1{
      margin:0 0 6px;
      font-size:14px;
      font-weight:600;
      letter-spacing:1px;
      color:#dfefff;
    }
    .ui span{
      color:#9ad7ff;
      font-size:12px;
    }

    .scene {
      position:relative;
      width:100vw;
      height:100vh;
      perspective: 1200px;
      overflow:hidden;
      user-select:none;
    }

    .agv-wrap{
      position:absolute;
      left:50%;
      top:52%;
      width:560px;
      height:360px;
      transform-style: preserve-3d;
      transform: translate(-50%,-50%) rotateX(-20deg) rotateY(-30deg);
      cursor:grab;
    }

    .agv-wrap.dragging{
      cursor:grabbing;
    }

    .agv{
      position:absolute;
      left:50%;
      top:50%;
      width:420px;
      height:220px;
      transform-style:preserve-3d;
      transform: translate(-50%,-50%);
    }

    /* 笼车体 */
    .body{
      position:absolute;
      left:-130px;
      top:-60px;
      width:260px;
      height:120px;
      transform-style:preserve-3d;
      transform:translateZ(40px);
    }

    .body .plate{
      position:absolute;
      inset:0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      border:2px solid rgba(148,184,214,0.7);
      border-radius:18px;
      box-shadow: inset 0 0 14px rgba(255,255,255,0.08), 0 10px 25px rgba(0,0,0,0.12);
      transform-style:preserve-3d;
    }

    .body .plate::before,
    .body .plate::after{
      content:"";
      position:absolute;
      inset:10px;
      border-radius:12px;
      border:1px solid rgba(160,210,255,0.35);
    }

    .body .plate::after{
      left:50%;
      width:1px;
      height:100%;
      background:rgba(160,210,255,0.35);
      inset:auto 50% 0 50%;
      transform:translateX(-50%);
    }

    .top-deck{
      position:absolute;
      left:-160px;
      top:-110px;
      width:320px;
      height:70px;
      background: linear-gradient(180deg, rgba(125,170,214,0.4), rgba(197,225,255,0.18));
      border:2px solid rgba(170,220,255,0.6);
      border-radius:16px;
      box-shadow:0 10px 20px rgba(0,0,0,0.12), inset 0 0 18px rgba(255,255,255,0.08);
      transform:translateZ(80px);
    }

    .top-deck::before{
      content:"";
      position:absolute;
      inset:12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.22);
    }

    .battery{
      position:absolute;
      left:45px;
      top:26px;
      width:80px;
      height:46px;
      background: linear-gradient(180deg, #62ecb1, #26b77f);
      border:2px solid rgba(200,255,235,0.7);
      border-radius:12px;
      transform:translateZ(60px);
      box-shadow: inset 0 0 10px rgba(255,255,255,0.25);
    }

    .controller{
      position:absolute;
      left:-110px;
      top:30px;
      width:80px;
      height:52px;
      background: linear-gradient(180deg, #b7d7ff, #7ea8d2);
      border:2px solid rgba(220,240,255,0.75);
      border-radius:12px;
      transform:translateZ(60px);
      box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
    }

    .sensor-mast{
      position:absolute;
      left:120px;
      top:-170px;
      width:26px;
      height:120px;
      background: linear-gradient(180deg, #dcecff, #99b5d9);
      border:2px solid rgba(225,240,255,0.8);
      border-radius:14px;
      transform:translateZ(95px);
      box-shadow:0 8px 20px rgba(0,0,0,0.15);
    }

    .lidar{
      position:absolute;
      left:104px;
      top:-188px;
      width:58px;
      height:58px;
      border-radius:50%;
      background: radial-gradient(circle at 35% 35%, #f8fbff 0%, #c8d9f2 35%, #6d90b3 100%);
      border:3px solid rgba(220,235,255,0.9);
      box-shadow:0 0 20px rgba(99,200,255,0.45);
      transform:translateZ(120px);
    }

    .lidar::before{
      content:"";
      position:absolute;
      inset:14px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,0.7);
    }

    .camera{
      position:absolute;
      left:-175px;
      top:-152px;
      width:34px;
      height:34px;
      border-radius:10px;
      background: linear-gradient(180deg, #f2f7ff, #b6d0f9);
      border:2px solid rgba(230,240,255,0.8);
      transform:translateZ(90px);
      box-shadow:0 6px 15px rgba(0,0,0,0.15);
    }

    .wheel{
      position:absolute;
      width:72px;
      height:72px;
      border-radius:50%;
      background: radial-gradient(circle at center, var(--wheel-rim) 0%, var(--wheel-rim) 18%, var(--wheel) 19%, var(--wheel) 60%, #111 100%);
      border:4px solid rgba(255,255,255,0.1);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.7);
    }

    .wheel::before{
      content:"";
      position:absolute;
      inset:18px;
      border-radius:50%;
      background: radial-gradient(circle, #d5dce4 0%, #7f8e9d 38%, #2f343a 100%);
      border:2px solid rgba(255,255,255,0.25);
    }

    .wheel::after{
      content:"";
      position:absolute;
      inset:30px;
      border-radius:50%;
      background: rgba(255,255,255,0.15);
      border:1px solid rgba(255,255,255,0.25);
    }

    .wheel.wl{
      left:-170px;
      top:90px;
      transform:translateZ(20px);
    }

    .wheel.wr{
      left:90px;
      top:90px;
      transform:translateZ(20px);
    }

    .wheel.c1{
      left:-65px;
      top:120px;
      width:56px;
      height:56px;
      transform:translateZ(12px);
    }

    .wheel.c2{
      left:52px;
      top:120px;
      width:56px;
      height:56px;
      transform:translateZ(12px);
    }

    .caster{
      position:absolute;
      width:34px;
      height:34px;
      border-radius:50%;
      background: radial-gradient(circle at 50% 45%, #eaf4ff 0%, #a9bfd8 30%, #596d7e 100%);
      border:2px solid rgba(255,255,255,0.4);
      box-shadow: inset 0 0 8px rgba(0,0,0,0.25);
    }

    .caster.caster1 { left:-20px; top:104px; transform:translateZ(18px); }
    .caster.caster2 { left:20px; top:104px; transform:translateZ(18px); }

    .bumper{
      position:absolute;
      width:18px;
      height:92px;
      background: linear-gradient(180deg, rgba(210,223,237,0.8), rgba(150,171,188,0.6));
      border:2px solid rgba(220,230,240,0.9);
      border-radius:8px;
      transform:translateZ(58px);
    }

    .bumper.front{
      left:144px;
      top:-8px;
    }

    .bumper.back{
      left:-162px;
      top:-8px;
    }

    .charging-port{
      position:absolute;
      left:170px;
      top:26px;
      width:40px;
      height:26px;
      background: linear-gradient(180deg, #7ce5ff, #2fa9d8);
      border:2px solid rgba(210,245,255,0.8);
      border-radius:8px;
      transform:translateZ(62px);
    }

    .ground{
      position:absolute;
      left:50%;
      top:72%;
      width:520px;
      height:120px;
      transform:translate(-50%, -50%) rotateX(90deg) translateZ(-10px);
      background: radial-gradient(circle, rgba(89,201,255,0.22), rgba(20,50,80,0.04) 55%, rgba(0,0,0,0));
      border-radius:50%;
      filter: blur(2px);
    }

    .label{
      position:absolute;
      font-size:11px;
      color:#dfeeff;
      text-shadow:0 2px 10px rgba(0,0,0,0.3);
      letter-spacing:1px;
      opacity:0.8;
    }

    .l1{ left:-8px; top:-120px; }
    .l2{ left:-150px; top:-95px; }
    .l3{ left:-120px; top:8px; }
    .l4{ left:80px; top:8px; }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="ui">
      <h1>AGV 机械结构</h1>
      <span>拖拽可旋转查看</span>
    </div>

    <div class="ground"></div>

    <div class="agv-wrap" id="agvWrap">
      <div class="agv">
        <div class="top-deck"></div>

        <div class="body">
          <div class="plate"></div>
        </div>

        <div class="controller"></div>
        <div class="battery"></div>

        <div class="sensor-mast"></div>
        <div class="lidar"></div>
        <div class="camera"></div>

        <div class="bumper front"></div>
        <div class="bumper back"></div>

        <div class="charging-port"></div>

        <div class="wheel wl"></div>
        <div class="wheel wr"></div>
        <div class="wheel c1"></div>
        <div class="wheel c2"></div>

        <div class="caster caster1"></div>
        <div class="caster caster2"></div>

        <div class="label l1">传感器</div>
        <div class="label l2">控制柜</div>
        <div class="label l3">电池</div>
        <div class="label l4">驱动轮</div>
      </div>
    </div>
  </div>

  <script>
    const wrap = document.getElementById('agvWrap');
    const scene = document.getElementById('scene');

    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let rotateX = -20;
    let rotateY = -30;

    const applyRotation = () => {
      wrap.style.transform = `translate(-50%,-50%) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    };

    scene.addEventListener('pointerdown', (e) => {
      isDragging = true;
      wrap.classList.add('dragging');
      startX = e.clientX;
      startY = e.clientY;
      scene.setPointerCapture(e.pointerId);
    });

    scene.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      rotateY += dx * 0.35;
      rotateX -= dy * 0.25;
      rotateX = Math.max(-75, Math.min(75, rotateX));
      startX = e.clientX;
      startY = e.clientY;
      applyRotation();
    });

    scene.addEventListener('pointerup', () => {
      isDragging = false;
      wrap.classList.remove('dragging');
    });

    scene.addEventListener('pointerleave', () => {
      isDragging = false;
      wrap.classList.remove('dragging');
    });

    applyRotation();
  </script>
</body>
</html>
